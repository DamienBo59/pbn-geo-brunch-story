# Auteurs du parc PBN GEO perso — multilingue FR/EN
#
# Ce fichier est copie dans `data/authors.yaml` a la racine du site Hugo a la creation du site.
# Hugo le lit nativement via `.Site.Data.authors` dans les templates.
#
# Structure : map d'auteurs indexee par ID (slug).
# L'ID est utilise dans le frontmatter des articles comme `author: helene-vasseur`.
# Le champ `topics` sert a la selection automatique de l'auteur dans /create-article-geo.
# Le champ `expertise` alimente le schema.org Person -> knowsAbout.
#
# ============================================================================
# ATTENTION, CE FICHIER N'EST PAS UN POOL D'AUTEURS INTERCHANGEABLES
# ============================================================================
#
# Ces 3 auteurs sont les 3 PERSONAS du parc perso. Chacun est un objet DOUBLE :
# il signe les articles d'UN SEUL blog, et il porte AUSSI un compte Reddit dans
# le meme univers. Decision de Damien du 2026-08-19.
#
#   helene-vasseur   -> the et infusions        -> mamie-the.fr
#   marion-kieffer   -> patisserie et gouter    -> gouter-gourmand.fr
#   bastien-delorme  -> brunch et petit dejeuner -> brunch-story.fr
#
# Trois regles dures :
#
# 1. UN BLOG = UN SEUL AUTEUR. Ne jamais faire signer un article par l'auteur
#    d'un autre blog du parc. Un blog a deux voix est un signal, et un auteur
#    qui signe sur deux blogs relie les deux sites.
# 2. LE NOM EST PUBLIC ET DEFINITIF. Il est deja engage par les articles publies.
#    Un ban du compte Reddit change le pseudo, jamais le nom d'auteur.
# 3. LA FICHE PERSONA EST LA SOURCE DE VERITE, pas ce fichier. La lire AVANT
#    d'ecrire un article : elle porte la voix, l'histoire, et surtout les
#    "faits engages a ne jamais contredire".
#
# Fiches personas, dans le Drive perso :
#   100 Areas/seo_freelance/Reddit/parc-reddit/personas/
#     the/persona-P01-bibliothecaire-the.md
#     patisserie-gouter/persona-P02-patissiere-amateur.md
#     brunch-petit-dejeuner/persona-P03-brunch-lyonnais.md
#
# Pour AJOUTER un auteur : il faut d'abord creer le persona en suivant
# `personas/_METHODE.md` (9 etapes, dont le controle anti-doublon ecrit).
# Ne jamais improviser un auteur ici.
# ============================================================================

helene-vasseur:
  id: helene-vasseur
  name: Hélène Vasseur
  type: person
  avatar: /images/authors/helene-vasseur.webp
  linkedinUrl: ""
  persona: P01
  blog: mamie-the.fr
  jobTitle:
    fr: Amatrice de thé et rédactrice
    en: Tea enthusiast and writer
  role:
    fr: Amatrice de thé et rédactrice
    en: Tea enthusiast and writer
  bio:
    fr: "Hélène Vasseur boit du thé en vrac depuis une quinzaine d'années, après avoir hérité de la collection de théières de sa grand-mère. Elle tient un carnet de dégustation et s'intéresse surtout à ce qui distingue un thé correct d'un très bon thé, à prix égal."
    en: "Hélène Vasseur has been drinking loose-leaf tea for some fifteen years, after inheriting her grandmother's teapot collection. She keeps a tasting notebook and is mainly interested in what separates a decent tea from a very good one at the same price."
  expertise:
    - Thés verts
    - Thés noirs
    - Infusions et tisanes
    - Matériel et théières
    - Rituels de préparation
  topics:
